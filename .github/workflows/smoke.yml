name: Windows validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Windows ${{ matrix.shell }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Parser and deterministic unit tests
        shell: ${{ matrix.shell }}
        run: ./tests/Smoke.Tests.ps1
      - name: Windows read-only integration
        shell: ${{ matrix.shell }}
        run: ./tests/Integration.Tests.ps1
