name: Windows validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for dependency-free static checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cross-platform static safety preflight
        shell: bash
        run: python tools/check_static.py
      - name: Synthetic NO-GO-only physical field evidence gate tests
        shell: bash
        run: python tests/FieldEvidenceGate.Tests.py
      - name: Synthetic private field status recorder tests
        shell: bash
        run: python tests/FieldStatusRecorder.Tests.py
      - name: Parse and deterministic tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Smoke.Tests.ps1
      - name: Injected process and OS collector tests
        shell: powershell
        run: ./tests/Collector.Tests.ps1
      - name: Synthetic event collector tests
        shell: powershell
        run: ./tests/EventCollector.Tests.ps1
      - name: Synthetic hardware collector tests
        shell: powershell
        run: ./tests/HardwareCollector.Tests.ps1
      - name: Synthetic handle-relative report file writer tests
        shell: powershell
        run: ./tests/HandleBoundWriter.Tests.ps1
      - name: Synthetic early report-path acquisition race tests
        shell: powershell
        run: ./tests/ReportPathAcquisition.Tests.ps1
      - name: Test-only parent-relative directory identity research
        shell: powershell
        run: ./tests/RelativeDirectoryProbe.Tests.ps1
      - name: Test-only pinned-directory handle ACL and owner research
        shell: powershell
        run: ./tests/HandleSecurityProbe.Tests.ps1
      - name: Synthetic handle-relative private directory creation research
        shell: powershell
        run: ./tests/DirectoryCreationProbe.Tests.ps1
      - name: Synthetic pinned-anchor multi-hop chain research
        shell: powershell
        run: ./tests/HandleChainProbe.Tests.ps1
      - name: Synthetic anchor identity and pre-open junction race research
        shell: powershell
        run: ./tests/AnchorRace.Tests.ps1
      - name: Research-only fixed-root fail-closed chain and namespace tests
        shell: powershell
        run: ./tests/RootedChain.Tests.ps1
      - name: Test-only full volume/file identity and GUID alias research
        shell: powershell
        run: ./tests/VolumeIdentityProbe.Tests.ps1
      - name: Test-only ephemeral anchor trust and alias substitution research
        shell: powershell
        run: ./tests/SyntheticAnchorLease.Tests.ps1
      - name: Research-only externally pinned status file trust-bound session
        shell: powershell
        run: ./tests/AnchorBoundFieldFileSession.Tests.ps1
      - name: Research-only parent-handle relative status file CREATE test
        shell: powershell
        run: ./tests/RelativeFieldFileProbe.Tests.ps1
      - name: Research-only create-time private field-status file DACL probe
        shell: powershell
        run: ./tests/FieldStatusFileCreateProbe.Tests.ps1
      - name: Research-only field status file ACL and sync-risk tests
        shell: powershell
        run: ./tests/FieldStatusAclResearch.Tests.ps1
      - name: Restricted report directory ACL tests
        shell: powershell
        run: ./tests/ReportSecurity.Tests.ps1
      - name: Synthetic read-only report retention metadata tests
        shell: powershell
        run: ./tests/ReportRetention.Tests.ps1
      - name: Synthetic privacy export tests
        shell: powershell
        run: ./tests/Privacy.Tests.ps1
      - name: Synthetic passive security collector tests
        shell: powershell
        run: ./tests/SecurityCollector.Tests.ps1
      - name: Synthetic opt-in scanner executor tests
        shell: powershell
        run: ./tests/ScanExecutor.Tests.ps1
      - name: Synthetic integrity verify-only executor tests
        shell: powershell
        run: ./tests/IntegrityCollector.Tests.ps1
      - name: Synthetic field-validation status tests
        shell: powershell
        run: ./tests/FieldValidation.Tests.ps1
      - name: Synthetic report schema contract tests
        shell: powershell
        run: ./tests/ReportContract.Tests.ps1
      - name: Full passive field runner (Windows PowerShell 5.1, test-owned temp reports)
        shell: powershell
        run: ./tests/FieldValidation.Integration.Tests.ps1
      - name: Read-only integration (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Integration.Tests.ps1

